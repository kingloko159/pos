<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>H&amp;M Auto POS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<script>
  (function () {
    var originalWarn = console.warn;
    console.warn = function () {
      var msg = Array.prototype.slice.call(arguments).join(" ");
      if (msg.indexOf("cdn.tailwindcss.com") !== -1 || msg.indexOf("in-browser Babel transformer") !== -1) {
        return;
      }
      originalWarn.apply(console, arguments);
    };
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------- Inline icon set (no external icon package needed) ----------
function Icon({ name, size = 16, color = "currentColor", style }) {
  const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style };
  switch (name) {
    case "wrench":
      return <svg {...p}><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>;
    case "plus":
      return <svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    case "x":
      return <svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    case "search":
      return <svg {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    case "car":
      return <svg {...p}><path d="M5 11l1.5-4.5A2 2 0 018.4 5h7.2a2 2 0 011.9 1.5L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>;
    case "chevronLeft":
      return <svg {...p}><polyline points="15 18 9 12 15 6"/></svg>;
    case "checkCircle2":
      return <svg {...p}><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    case "circle":
      return <svg {...p}><circle cx="12" cy="12" r="10"/></svg>;
    case "clipboardList":
      return <svg {...p}><rect x="6" y="4" width="12" height="18" rx="2"/><path d="M9 2h6a1 1 0 011 1v1H8V3a1 1 0 011-1z"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="14" y2="15"/></svg>;
    case "printer":
      return <svg {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>;
    case "fileDown":
      return <svg {...p}><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="M9 15l3 3 3-3"/></svg>;
    default:
      return null;
  }
}

const TAX_RATE = 0.06625; // NJ state sales tax

const DEFAULT_CATALOG = [
  { id: "l1", name: "Oil & Filter Change", price: 65, type: "Labor", taxable: false },
  { id: "l2", name: "Brake Pad Replacement (per axle)", price: 140, type: "Labor", taxable: false },
  { id: "l3", name: "Tire Rotation", price: 30, type: "Labor", taxable: false },
  { id: "l4", name: "Diagnostic Scan", price: 95, type: "Labor", taxable: false },
  { id: "l5", name: "Battery Install", price: 25, type: "Labor", taxable: false },
  { id: "l6", name: "State Inspection", price: 40, type: "Labor", taxable: false },
  { id: "p1", name: "Synthetic Oil (5qt)", price: 42, type: "Parts", taxable: true },
  { id: "p2", name: "Oil Filter", price: 12, type: "Parts", taxable: true },
  { id: "p3", name: "Brake Pad Set", price: 68, type: "Parts", taxable: true },
  { id: "p4", name: "Car Battery", price: 129, type: "Parts", taxable: true },
  { id: "p5", name: "Wiper Blade Pair", price: 24, type: "Parts", taxable: true },
  { id: "p6", name: "Air Filter", price: 18, type: "Parts", taxable: true },
];

function currency(n) {
  return n.toLocaleString("en-US", { style: "currency", currency: "USD" });
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

function buildInvoiceHtml(ticket) {
  const rows = ticket.items
    .map(
      (c) => `<tr>
        <td style="padding:4px 0;">${c.qty}&times; ${escapeHtml(c.name)}</td>
        <td style="padding:4px 0;text-align:right;white-space:nowrap;">${currency(c.price * c.qty)}</td>
      </tr>`
    )
    .join("");

  const customerLines = [
    ticket.customer.name && `<strong>Customer:</strong> ${escapeHtml(ticket.customer.name)}`,
    ticket.customer.phone && `<strong>Phone:</strong> ${escapeHtml(ticket.customer.phone)}`,
    ticket.customer.vehicle && `<strong>Vehicle:</strong> ${escapeHtml(ticket.customer.vehicle)}`,
    ticket.customer.plate && `<strong>Plate:</strong> ${escapeHtml(ticket.customer.plate)}`,
    ticket.customer.vin && `<strong>VIN:</strong> ${escapeHtml(ticket.customer.vin)}`,
  ]
    .filter(Boolean)
    .map((l) => `<div>${l}</div>`)
    .join("");

  return `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Invoice #${ticket.id}</title>
<style>
  @page { margin: 24px; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; color: #1C1E22; margin: 0; padding: 24px; background: #fff; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #1C1E22; padding-bottom: 10px; margin-bottom: 12px; }
  .shop-name { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
  .muted { color: #555; font-size: 12px; }
  .invoice-no { text-align: right; }
  .invoice-no .label { font-size: 11px; color: #555; }
  .invoice-no .num { font-size: 20px; font-weight: 700; }
  .customer { font-size: 12px; margin-bottom: 14px; line-height: 1.5; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .totals { margin-top: 12px; padding-top: 8px; border-top: 1px solid #1C1E22; font-size: 14px; }
  .totals .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .totals .total { font-weight: 700; font-size: 16px; padding-top: 6px; }
  .terms { margin-top: 20px; padding-top: 12px; border-top: 1px solid #1C1E22; font-size: 10px; color: #555; line-height: 1.5; }
  .sign { display: flex; justify-content: space-between; gap: 40px; margin-top: 32px; }
  .sign .field { flex: 1; }
  .sign .line { border-bottom: 1px solid #1C1E22; height: 28px; }
  .sign .caption { font-size: 10px; color: #555; margin-top: 4px; }
</style>
</head>
<body>
  <div class="header">
    <div>
      <div class="shop-name">${escapeHtml(ticket.shop.name)}</div>
      <div class="muted">${escapeHtml(ticket.shop.address)}</div>
      <div class="muted">${escapeHtml(ticket.shop.phone)}</div>
    </div>
    <div class="invoice-no">
      <div class="label">INVOICE</div>
      <div class="num">#${ticket.id}</div>
      <div class="muted">${new Date(ticket.date).toLocaleString()}</div>
    </div>
  </div>
  <div class="customer">${customerLines}</div>
  <table>${rows}</table>
  <div class="totals">
    <div class="row"><span>Subtotal</span><span>${currency(ticket.subtotal)}</span></div>
    <div class="row muted"><span>NJ Sales Tax (6.625%)</span><span>${currency(ticket.tax)}</span></div>
    <div class="row total"><span>Total</span><span>${currency(ticket.total)}</span></div>
  </div>
  <div class="terms">
    I hereby authorize the above repair work to be done along with the necessary materials, and hereby grant you and/or your employees permission to operate the vehicle described above for purposes of testing and/or inspection. An express mechanic's lien is acknowledged on this vehicle to secure the amount of repairs thereto. Not responsible for loss or damage to vehicle or articles left in vehicle in case of fire, theft, or any other cause beyond our control.
  </div>
  <div class="sign">
    <div class="field"><div class="line"></div><div class="caption">Customer Signature</div></div>
    <div class="field" style="flex:0 0 90px;"><div class="line"></div><div class="caption">Date</div></div>
  </div>
  <div class="print-bar" style="margin-top:28px;text-align:center;">
    <button onclick="window.print()" style="background:#1C1E22;color:#fff;border:none;padding:12px 20px;border-radius:8px;font-size:15px;font-family:inherit;">
      Print / Save as PDF
    </button>
    <div style="font-size:11px;color:#888;margin-top:8px;">
      Tap above, then choose "Save as PDF" or "Save to Files" in the share sheet.
    </div>
  </div>
  <style>
    @media print { .print-bar { display: none !important; } }
  </style>
</body>
</html>`;
}

function printTicket(ticket) {
  if (!ticket) return;
  const html = buildInvoiceHtml(ticket);
  try {
    const blob = new Blob([html], { type: "text/html" });
    const blobUrl = URL.createObjectURL(blob);
    const win = window.open(blobUrl, "_blank");
    if (win) {
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
      return;
    }
  } catch (e) {
    console.error("Blob open failed, falling back:", e);
  }
  try {
    const dataUri = "data:text/html;charset=utf-8," + encodeURIComponent(html);
    const a = document.createElement("a");
    a.href = dataUri;
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (e) {
    console.error("Invoice open failed:", e);
  }
}

function CartRow({ c, updateQty, removeItem, fontMono }) {
  return (
    <div className="flex items-center justify-between text-sm">
      <div className="flex items-center gap-2 flex-1">
        <button onClick={() => removeItem(c.id)} className="opacity-40 hover:opacity-100">
          <Icon name="x" size={12} />
        </button>
        <span>{c.name}</span>
      </div>
      <div className="flex items-center gap-2">
        <input
          type="number"
          value={c.qty}
          onChange={(e) => {
            const v = e.target.value;
            if (v === "") return;
            updateQty(c.id, parseInt(v, 10));
          }}
          style={{ ...fontMono, width: "32px", background: "transparent", borderBottom: "1px solid #ccc" }}
          className="text-center outline-none"
        />
        <span style={fontMono} className="w-16 text-right">{(c.price * c.qty).toLocaleString("en-US", { style: "currency", currency: "USD" })}</span>
      </div>
    </div>
  );
}

function MechanicPOS() {
  const [shop, setShop] = useState({
    name: "H&M Auto",
    address: "375 Middle Rd, Hazlet, NJ 07730",
    phone: "(848) 338-4745",
  });
  const [editingShop, setEditingShop] = useState(false);

  const [catalog] = useState(DEFAULT_CATALOG);
  const [search, setSearch] = useState("");
  const [cart, setCart] = useState([]);
  const [customer, setCustomer] = useState({ name: "", phone: "", vehicle: "", plate: "", vin: "" });
  const [customItem, setCustomItem] = useState({ name: "", price: "" });
  const [showCustomForm, setShowCustomForm] = useState(false);

  const [tickets, setTickets] = useState([]);
  const [ticketNo, setTicketNo] = useState(1001);
  const [view, setView] = useState("builder");
  const [activeTicket, setActiveTicket] = useState(null);

  const filtered = useMemo(() => {
    if (!search.trim()) return catalog;
    const q = search.toLowerCase();
    return catalog.filter((c) => c.name.toLowerCase().includes(q));
  }, [catalog, search]);

  function addToCart(item) {
    setCart((prev) => {
      const existing = prev.find((c) => c.id === item.id);
      if (existing) {
        return prev.map((c) => (c.id === item.id ? { ...c, qty: c.qty + 1 } : c));
      }
      return [...prev, { ...item, qty: 1 }];
    });
  }

  function addCustomItem() {
    const price = parseFloat(customItem.price);
    if (!customItem.name.trim() || isNaN(price) || price < 0) return;
    const item = {
      id: "custom-" + Date.now(),
      name: customItem.name.trim(),
      price,
      type: "Custom",
      taxable: true,
      qty: 1,
    };
    setCart((prev) => [...prev, item]);
    setCustomItem({ name: "", price: "" });
    setShowCustomForm(false);
  }

  function updateQty(id, qty) {
    const safeQty = Number.isFinite(qty) && qty > 0 ? qty : 1;
    setCart((prev) => prev.map((c) => (c.id === id ? { ...c, qty: safeQty } : c)));
  }

  function removeItem(id) {
    setCart((prev) => prev.filter((c) => c.id !== id));
  }

  const subtotal = cart.reduce((sum, c) => sum + c.price * c.qty, 0);
  const tax = Math.round(subtotal * TAX_RATE * 100) / 100;
  const total = Math.round((subtotal + tax) * 100) / 100;

  function resetTicket() {
    setCart([]);
    setCustomer({ name: "", phone: "", vehicle: "", plate: "", vin: "" });
  }

  function saveTicket(status) {
    if (cart.length === 0) return;
    const ticket = { id: ticketNo, date: new Date(), customer, items: cart, subtotal, tax, total, status, shop };
    setTickets((prev) => [ticket, ...prev]);
    setTicketNo((n) => n + 1);
    setActiveTicket(ticket);
    setView("ticket");
    resetTicket();
  }

  function togglePaid(id) {
    setTickets((prev) => prev.map((t) => (t.id === id ? { ...t, status: t.status === "paid" ? "open" : "paid" } : t)));
    setActiveTicket((prev) => (prev && prev.id === id ? { ...prev, status: prev.status === "paid" ? "open" : "paid" } : prev));
  }

  const fontDisplay = { fontFamily: "'Oswald', sans-serif" };
  const fontBody = { fontFamily: "'Inter', sans-serif" };
  const fontMono = { fontFamily: "'JetBrains Mono', monospace" };

  return (
    <div style={{ ...fontBody, background: "#1C1E22", color: "#EDEEF0", minHeight: "100%" }} className="w-full min-h-screen">
      <div style={{ background: "#26292F", borderBottom: "3px solid #F2A900" }} className="px-4 py-3">
        <div className="flex items-center justify-between max-w-6xl mx-auto">
          <div className="flex items-center gap-2">
            <div style={{ background: "#F2A900" }} className="w-8 h-8 rounded flex items-center justify-center">
              <Icon name="wrench" size={18} color="#1C1E22" />
            </div>
            {editingShop ? (
              <input
                autoFocus
                value={shop.name}
                onChange={(e) => setShop({ ...shop, name: e.target.value })}
                onBlur={() => setEditingShop(false)}
                style={{ ...fontDisplay, background: "transparent", borderBottom: "1px solid #F2A900" }}
                className="text-lg tracking-wide uppercase outline-none"
              />
            ) : (
              <h1 onClick={() => setEditingShop(true)} style={fontDisplay} className="text-lg tracking-wide uppercase cursor-pointer" title="Click to edit shop name">
                {shop.name}
              </h1>
            )}
          </div>
          <div className="flex items-center gap-1">
            <button
              onClick={() => setView("builder")}
              style={{ ...fontBody, background: view === "builder" ? "#F2A900" : "transparent", color: view === "builder" ? "#1C1E22" : "#EDEEF0" }}
              className="px-3 py-1.5 rounded text-sm font-medium flex items-center gap-1.5"
            >
              <Icon name="plus" size={14} /> New Ticket
            </button>
            <button
              onClick={() => setView("history")}
              style={{ ...fontBody, background: view === "history" ? "#F2A900" : "transparent", color: view === "history" ? "#1C1E22" : "#EDEEF0" }}
              className="px-3 py-1.5 rounded text-sm font-medium flex items-center gap-1.5"
            >
              <Icon name="clipboardList" size={14} /> History ({tickets.length})
            </button>
          </div>
        </div>
      </div>

      {view === "builder" && (
        <div className="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-5 gap-6">
          <div className="lg:col-span-3 space-y-4">
            <div style={{ background: "#26292F" }} className="rounded-lg p-4">
              <div className="flex items-center gap-2 mb-3">
                <Icon name="search" size={15} color="#8A8F98" />
                <input
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Search services or parts..."
                  style={{ ...fontBody, background: "#1C1E22", color: "#EDEEF0" }}
                  className="flex-1 rounded px-3 py-2 text-sm outline-none border border-transparent focus:border-[#F2A900]"
                />
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-72 overflow-y-auto pr-1">
                {filtered.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => addToCart(item)}
                    style={{ background: "#1C1E22" }}
                    className="text-left rounded p-3 hover:ring-1 hover:ring-[#F2A900] transition"
                  >
                    <div className="flex items-center justify-between">
                      <span style={{ fontSize: "10px", letterSpacing: "0.08em", color: item.type === "Labor" ? "#7FB8E8" : "#F2A900" }} className="uppercase font-semibold">
                        {item.type}
                      </span>
                      <span style={fontMono} className="text-sm">{currency(item.price)}</span>
                    </div>
                    <div className="text-sm mt-1">{item.name}</div>
                  </button>
                ))}
                {filtered.length === 0 && <div style={{ color: "#8A8F98" }} className="text-sm col-span-2 py-4 text-center">No matches.</div>}
              </div>

              {!showCustomForm ? (
                <button onClick={() => setShowCustomForm(true)} style={{ color: "#F2A900" }} className="mt-3 text-sm flex items-center gap-1.5">
                  <Icon name="plus" size={14} /> Add custom line item
                </button>
              ) : (
                <div style={{ background: "#1C1E22" }} className="mt-3 rounded p-3 space-y-2">
                  <div className="flex gap-2">
                    <input
                      placeholder="Item name"
                      value={customItem.name}
                      onChange={(e) => setCustomItem({ ...customItem, name: e.target.value })}
                      style={{ background: "#26292F", color: "#EDEEF0" }}
                      className="flex-1 rounded px-2 py-1.5 text-sm outline-none"
                    />
                    <input
                      placeholder="Price"
                      type="number"
                      value={customItem.price}
                      onChange={(e) => setCustomItem({ ...customItem, price: e.target.value })}
                      style={{ background: "#26292F", color: "#EDEEF0", width: "90px" }}
                      className="rounded px-2 py-1.5 text-sm outline-none"
                    />
                  </div>
                  <label className="flex items-center gap-2 text-xs" style={{ color: "#8A8F98" }}>
                    Tax (6.625%) is applied automatically to the full ticket total.
                  </label>
                  <div className="flex gap-2 pt-1">
                    <button onClick={addCustomItem} style={{ background: "#F2A900", color: "#1C1E22" }} className="text-sm px-3 py-1.5 rounded font-medium">Add</button>
                    <button onClick={() => setShowCustomForm(false)} style={{ color: "#8A8F98" }} className="text-sm px-3 py-1.5">Cancel</button>
                  </div>
                </div>
              )}
            </div>

            <div style={{ background: "#26292F" }} className="rounded-lg p-4">
              <h3 style={fontDisplay} className="uppercase text-sm tracking-wide mb-3 flex items-center gap-2">
                <Icon name="car" size={15} /> Customer & Vehicle
              </h3>
              <div className="grid grid-cols-2 gap-2">
                {[
                  ["name", "Customer name"],
                  ["phone", "Phone"],
                  ["vehicle", "Year / Make / Model"],
                  ["plate", "Plate #"],
                  ["vin", "VIN (optional)"],
                ].map(([key, label]) => (
                  <input
                    key={key}
                    placeholder={label}
                    value={customer[key]}
                    onChange={(e) => setCustomer({ ...customer, [key]: e.target.value })}
                    style={{ background: "#1C1E22", color: "#EDEEF0" }}
                    className={"rounded px-3 py-2 text-sm outline-none " + (key === "vin" ? "col-span-2" : "")}
                  />
                ))}
              </div>
            </div>
          </div>

          <div className="lg:col-span-2">
            <div
              style={{ background: "#F4F1EA", color: "#1C1E22", backgroundImage: "repeating-linear-gradient(to bottom, transparent, transparent 27px, rgba(0,0,0,0.03) 28px)" }}
              className="rounded-lg p-5 sticky top-4"
            >
              <div className="flex items-center justify-between border-b-2 pb-2 mb-3" style={{ borderColor: "#1C1E22" }}>
                <div>
                  <div style={fontDisplay} className="text-base uppercase tracking-wide leading-tight">{shop.name}</div>
                  <div className="text-[11px]" style={{ color: "#555" }}>{shop.address}</div>
                  <div className="text-[11px]" style={{ color: "#555" }}>{shop.phone}</div>
                </div>
                <div className="text-right">
                  <div style={{ ...fontMono, fontSize: "11px", color: "#555" }}>INVOICE</div>
                  <div style={{ ...fontMono, fontWeight: 700 }} className="text-lg">#{ticketNo}</div>
                </div>
              </div>

              {(customer.name || customer.vehicle) && (
                <div className="text-xs mb-3 space-y-0.5" style={{ color: "#333" }}>
                  {customer.name && <div><strong>Customer:</strong> {customer.name}</div>}
                  {customer.vehicle && <div><strong>Vehicle:</strong> {customer.vehicle}</div>}
                  {customer.plate && <div><strong>Plate:</strong> {customer.plate}</div>}
                </div>
              )}

              <div className="space-y-1.5 min-h-[80px]">
                {cart.length === 0 && <div style={{ color: "#999" }} className="text-sm py-6 text-center">Tap a service or part to add it here.</div>}
                {cart.map((c) => (
                  <CartRow key={c.id} c={c} updateQty={updateQty} removeItem={removeItem} fontMono={fontMono} />
                ))}
              </div>

              {cart.length > 0 && (
                <React.Fragment>
                  <div className="border-t mt-3 pt-2 space-y-1 text-sm" style={{ borderColor: "#1C1E22" }}>
                    <div className="flex justify-between"><span>Subtotal</span><span style={fontMono}>{currency(subtotal)}</span></div>
                    <div className="flex justify-between" style={{ color: "#555" }}>
                      <span>NJ Sales Tax (6.625%)</span><span style={fontMono}>{currency(tax)}</span>
                    </div>
                    <div className="flex justify-between font-bold text-base pt-1"><span>Total</span><span style={fontMono}>{currency(total)}</span></div>
                  </div>
                  <div className="border-t mt-3 pt-3" style={{ borderColor: "#1C1E22" }}>
                    <p className="text-[10px] leading-snug" style={{ color: "#555" }}>
                      I hereby authorize the above repair work to be done along with the necessary materials, and hereby grant you and/or your employees permission to operate the vehicle described above for purposes of testing and/or inspection. An express mechanic's lien is acknowledged on this vehicle to secure the amount of repairs thereto. Not responsible for loss or damage to vehicle or articles left in vehicle in case of fire, theft, or any other cause beyond our control.
                    </p>
                    <div className="flex items-end justify-between mt-4 gap-6">
                      <div className="flex-1">
                        <div style={{ borderBottom: "1px solid #1C1E22", height: "28px" }}></div>
                        <div className="text-[10px] mt-1" style={{ color: "#555" }}>Customer Signature</div>
                      </div>
                      <div style={{ width: "90px" }}>
                        <div style={{ borderBottom: "1px solid #1C1E22", height: "28px" }}></div>
                        <div className="text-[10px] mt-1" style={{ color: "#555" }}>Date</div>
                      </div>
                    </div>
                  </div>
                  <div className="flex gap-2 mt-4">
                    <button onClick={() => saveTicket("open")} style={{ background: "#1C1E22", color: "#F4F1EA" }} className="flex-1 rounded py-2 text-sm font-medium">Save Ticket</button>
                    <button onClick={() => saveTicket("paid")} style={{ background: "#F2A900", color: "#1C1E22" }} className="flex-1 rounded py-2 text-sm font-medium">Save & Mark Paid</button>
                  </div>
                </React.Fragment>
              )}
            </div>
          </div>
        </div>
      )}

      {view === "history" && (
        <div className="max-w-3xl mx-auto px-4 py-6">
          {tickets.length === 0 ? (
            <div style={{ color: "#8A8F98" }} className="text-center py-16 text-sm">No tickets yet. Build one from "New Ticket".</div>
          ) : (
            <div className="space-y-2">
              {tickets.map((t) => (
                <button
                  key={t.id}
                  onClick={() => { setActiveTicket(t); setView("ticket"); }}
                  style={{ background: "#26292F" }}
                  className="w-full text-left rounded-lg p-4 flex items-center justify-between hover:ring-1 hover:ring-[#F2A900]"
                >
                  <div>
                    <div style={fontMono} className="text-sm">#{t.id} — {t.customer.name || "Walk-in"}</div>
                    <div style={{ color: "#8A8F98" }} className="text-xs">{t.customer.vehicle || "No vehicle on file"} · {t.date.toLocaleDateString()}</div>
                  </div>
                  <div className="flex items-center gap-3">
                    <span style={fontMono} className="text-sm">{currency(t.total)}</span>
                    <span
                      onClick={(e) => { e.stopPropagation(); togglePaid(t.id); }}
                      style={{ color: t.status === "paid" ? "#4CAF6D" : "#8A8F98" }}
                      className="flex items-center gap-1 text-xs"
                    >
                      <Icon name={t.status === "paid" ? "checkCircle2" : "circle"} size={14} />
                      {t.status === "paid" ? "Paid" : "Open"}
                    </span>
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>
      )}

      {view === "ticket" && activeTicket && (
        <div className="max-w-md mx-auto px-4 py-6">
          <button onClick={() => setView("history")} style={{ color: "#8A8F98" }} className="text-sm flex items-center gap-1 mb-3">
            <Icon name="chevronLeft" size={14} /> Back to history
          </button>
          <div style={{ background: "#F4F1EA", color: "#1C1E22" }} className="rounded-lg p-5">
            <div className="flex items-center justify-between border-b-2 pb-2 mb-3" style={{ borderColor: "#1C1E22" }}>
              <div>
                <div style={fontDisplay} className="text-base uppercase tracking-wide">{activeTicket.shop.name}</div>
                <div className="text-[11px]" style={{ color: "#555" }}>{activeTicket.shop.address}</div>
                <div className="text-[11px]" style={{ color: "#555" }}>{activeTicket.shop.phone}</div>
              </div>
              <div className="text-right">
                <div style={{ ...fontMono, fontSize: "11px", color: "#555" }}>INVOICE</div>
                <div style={{ ...fontMono, fontWeight: 700 }} className="text-lg">#{activeTicket.id}</div>
                <div className="text-[10px]" style={{ color: "#555" }}>{activeTicket.date.toLocaleString()}</div>
              </div>
            </div>
            <div className="text-xs mb-3 space-y-0.5" style={{ color: "#333" }}>
              {activeTicket.customer.name && <div><strong>Customer:</strong> {activeTicket.customer.name}</div>}
              {activeTicket.customer.phone && <div><strong>Phone:</strong> {activeTicket.customer.phone}</div>}
              {activeTicket.customer.vehicle && <div><strong>Vehicle:</strong> {activeTicket.customer.vehicle}</div>}
              {activeTicket.customer.plate && <div><strong>Plate:</strong> {activeTicket.customer.plate}</div>}
              {activeTicket.customer.vin && <div><strong>VIN:</strong> {activeTicket.customer.vin}</div>}
            </div>
            <div className="space-y-1.5">
              {activeTicket.items.map((c) => (
                <div key={c.id} className="flex justify-between text-sm">
                  <span>{c.qty}× {c.name}</span>
                  <span style={fontMono}>{currency(c.price * c.qty)}</span>
                </div>
              ))}
            </div>
            <div className="border-t mt-3 pt-2 space-y-1 text-sm" style={{ borderColor: "#1C1E22" }}>
              <div className="flex justify-between"><span>Subtotal</span><span style={fontMono}>{currency(activeTicket.subtotal)}</span></div>
              <div className="flex justify-between" style={{ color: "#555" }}><span>NJ Sales Tax (6.625%)</span><span style={fontMono}>{currency(activeTicket.tax)}</span></div>
              <div className="flex justify-between font-bold text-base pt-1"><span>Total</span><span style={fontMono}>{currency(activeTicket.total)}</span></div>
            </div>
            <div className="border-t mt-4 pt-3" style={{ borderColor: "#1C1E22" }}>
              <p className="text-[10px] leading-snug" style={{ color: "#555" }}>
                I hereby authorize the above repair work to be done along with the necessary materials, and hereby grant you and/or your employees permission to operate the vehicle described above for purposes of testing and/or inspection. An express mechanic's lien is acknowledged on this vehicle to secure the amount of repairs thereto. Not responsible for loss or damage to vehicle or articles left in vehicle in case of fire, theft, or any other cause beyond our control.
              </p>
              <div className="flex items-end justify-between mt-4 gap-6">
                <div className="flex-1">
                  <div style={{ borderBottom: "1px solid #1C1E22", height: "28px" }}></div>
                  <div className="text-[10px] mt-1" style={{ color: "#555" }}>Customer Signature</div>
                </div>
                <div style={{ width: "90px" }}>
                  <div style={{ borderBottom: "1px solid #1C1E22", height: "28px" }}></div>
                  <div className="text-[10px] mt-1" style={{ color: "#555" }}>Date</div>
                </div>
              </div>
            </div>
            <div className="flex items-center justify-between mt-4">
              <span
                onClick={() => togglePaid(activeTicket.id)}
                style={{ color: activeTicket.status === "paid" ? "#4CAF6D" : "#8A8F98", cursor: "pointer" }}
                className="flex items-center gap-1 text-sm"
              >
                <Icon name={activeTicket.status === "paid" ? "checkCircle2" : "circle"} size={16} />
                {activeTicket.status === "paid" ? "Paid" : "Mark as paid"}
              </span>
              <div className="flex gap-2">
                <button onClick={() => printTicket(activeTicket)} style={{ background: "#1C1E22", color: "#F4F1EA" }} className="text-sm px-3 py-1.5 rounded flex items-center gap-1.5">
                  <Icon name="printer" size={14} /> Print
                </button>
                <button onClick={() => printTicket(activeTicket)} style={{ background: "#F2A900", color: "#1C1E22" }} className="text-sm px-3 py-1.5 rounded flex items-center gap-1.5">
                  <Icon name="fileDown" size={14} /> Save as PDF
                </button>
              </div>
            </div>
            <div className="text-[10px] text-right mt-1.5" style={{ color: "#8A8F98" }}>
              In the dialog that opens, choose "Save as PDF" (or "Print to PDF"). If it opens in a new tab first, tap "Print / Save as PDF" there.
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MechanicPOS />);
</script>
</body>
</html>
